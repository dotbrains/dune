name: Druk Watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: druk-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check Druk upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - run: flox activate -- bun scripts/check-druk.ts
